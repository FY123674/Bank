<!DOCTYPE html>
<html lang="zh-Hant">
<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title>貸款申請填寫</title>
 <link rel="stylesheet"
   href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
 <link rel="stylesheet"
   href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
 <link rel="stylesheet" href="../css/all.css" />
</head>
<body>
 <header>
   <div class="logo">
     <img src="../img/logo.svg" alt="logo" />
   </div>
 </header>
 <section>
   <h2>貸款申請表單</h2>
   <form action="/InsertLoan" method="post">
     <!-- 使用者 ID -->
     <label for="mid">會員 ID:</label>
     <input type="number" name="mid" id="mid" required placeholder="請輸入您的會員編號" />
     <!-- 貸款金額 -->
     <label for="loanAmount">貸款金額（萬元）:</label>
     <input type="number" name="loanAmount" id="loanAmount" min="1" max="500" required placeholder="最多 500 萬元" />
     <!-- 貸款期數 -->
     <label for="loanTerm">貸款期數（月）:</label>
     <select name="loanTerm" id="loanTerm" required>
       <option value="6">6 個月</option>
       <option value="9">9 個月</option>
       <option value="12">12 個月</option>
       <option value="24">24 個月</option>
       <option value="36">36 個月</option>
       <option value="48">48 個月</option>
       <option value="60">60 個月</option>
     </select>
     <!-- 貸款類型 -->
     <label for="loanTypeId">貸款類型:</label>
     <select name="loanTypeId" id="loanTypeId" required>
       <option value="CAR">車貸</option>
       <option value="HOUSE">房貸</option>
       <option value="EDU">就學貸款</option>
     </select>
     <!-- 開始日期 -->
     <label for="loanstartDate">貸款開始日期:</label>
     <input type="date" name="loanstartDate" id="loanstartDate" required />
     <!-- 隱藏欄位 -->
     <input type="hidden" name="approvalStatus" value="PENDING" />
     <input type="hidden" name="createdAt" id="createdAt" />
     <input type="hidden" name="updatedAt" id="updatedAt" />
     <!-- 送出 -->
     <button type="submit">送出申請</button>
   </form>
 </section>
 <footer>
   <div class="footer-left">
     <h3>YuzuBank</h3>
     <p>「讓理財像剝柚子一樣自然、簡單。」</p>
     <p>Copyright © 2025 柚子銀行 All Rights Reserved.</p>
   </div>
   <div class="footer-right">
     <span class="material-symbols-rounded">qr_code</span>
     <div class="footer-right-content">
       <h4>聯絡我們</h4>
       <p>電話：02-12345678</p>
       <p>Email：info@example.com</p>
     </div>
   </div>
 </footer>
 <script>
   // 自動補上 createdAt 和 updatedAt 為現在時間（ISO 格式）
   const now = new Date().toISOString();
   document.getElementById("createdAt").value = now;
   document.getElementById("updatedAt").value = now;
 </script>
</body>
</html>
