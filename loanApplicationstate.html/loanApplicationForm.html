<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>貸款申請填寫</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="../css/all.css">
</head>
<body>
  <header>
    <div class="logo">
      <img src="../img/logo.svg" alt="logo">
    </div>
  </header>
  <section>
    <form action="">
      <label for="loanType">貸款類型:</label>
      <select name="loanType" id="loanType">
        <option value="loanType">車貸</option>
        <option value="loanType">信貸</option>
        <option value="loanType">就學貸款</option>
        <option value="loanType">房屋貸款</option>
      </select>
      <label for="loanTime">貸款期限:</label>
      <select name="loanType" id="loanTime">
        <option value="loanType">長期</option>
        <option value="loanType">中期</option>
        <option value="loanType">短期</option>
      </select>
      <label for="loanPeriod">貸款期數:</label>
      <select name="loanType" id="loanPeriod">
        <option value="loanType">3</option>
        <option value="loanType">6</option>
        <option value="loanType">9</option>
        <option value="loanType">12</option>
        <option value="loanType">18</option>
        <option value="loanType">36</option>
        <option value="loanType">48</option>
      </select>
      <label for="loanAmount">貸款金額:$</label>
      <input type="number" id="loanAmount">
      <label for="loanPurpose">貸款用途</label>
      <textarea type="text" id="loanPurpose"></textarea>
    </form>
  </section>
  <footer>
    <div class="footer-left">
      <h3>YuzuBank</h3>
      <p>「讓理財像剝柚子一樣自然、簡單。」</p>
      <p>Copyright © 2025 柚子銀行 All Rights Reserved.</p>
    </div>
    <div class="footer-right">
      <span class="material-symbols-rounded">qr_code</span>
      <div class="footer-right-content">
        <h4>聯絡我們</h4>
        <p>電話：02-12345678</p>
        <p>Email：info@example.com</p>
      </div>
    </div>
  </footer>
</body>
</html>
